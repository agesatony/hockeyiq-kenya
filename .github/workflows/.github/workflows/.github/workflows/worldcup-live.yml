name: World Cup live refresh

# Scrapes only the fast, single-page FIH World Cup standings (05) and then
# re-runs 03's dashboard-building cells so the published dashboard picks up
# fresh World Cup context several times a day, without re-running the slow
# 130+ page domestic scrape (01) or the international scrape (04) — exactly
# the reasoning already documented inside 05_worldcup_live.ipynb itself:
# "not useful for something fans would want to actually follow" if it only
# refreshed once a week, but also not worth the GitHub Actions minutes to
# re-scrape everything else just to update one section.
#
# The cron below is restricted to 15-30 August, matching the 2026 edition's
# dates. UPDATE THESE DAY-OF-MONTH/MONTH VALUES for future World Cup
# editions, or delete this workflow (or just stop merging updates to it)
# once the 2026 tournament ends — the pool tabs it scrapes go away after
# the tournament, and running it after 30 August will legitimately find no
# data to update.

on:
  schedule:
    - cron: "0 */3 15-30 8 *"   # Every 3 hours, 15-30 August only
  workflow_dispatch: {}          # Manual override, any date

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "worldcup-live"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run 05_worldcup_live.ipynb
        working-directory: notebooks
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 05_worldcup_live.ipynb

      - name: Check domestic base data exists
        id: basecheck
        working-directory: data/processed
        run: |
          if [ -f matches.csv ] && [ -f performance_metrics.csv ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No domestic processed data yet — run the domestic-weekly workflow at least once first. Skipping dashboard rebuild this run."
          fi

      - name: Rebuild dashboard (03) with fresh World Cup data
        if: steps.basecheck.outputs.ready == 'true'
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 03_advanced_analytics.ipynb

      - name: Commit refreshed World Cup data + dashboard
        if: steps.basecheck.outputs.ready == 'true'
        run: |
          git config user.name "hockeyiq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/world_cup_standings.csv data/processed/world_cup_team_stats.csv notebooks/*.ipynb reports/
          git diff --cached --quiet || git commit -m "Automated World Cup live refresh [skip ci]"
          git push

      - name: Prepare Pages artifact
        if: steps.basecheck.outputs.ready == 'true'
        run: |
          mkdir -p site
          cp reports/dashboard.html site/index.html

      - name: Upload Pages artifact
        if: steps.basecheck.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.basecheck.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
